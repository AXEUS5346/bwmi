<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="60" height="60">
  <!-- Ashoka Emblem - MCA Logo -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#004B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#033247;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <!-- Ashoka Pillar base -->
  <rect x="90" y="60" width="20" height="80" fill="url(#goldGrad)" rx="3"/>
  <!-- Lion Capital - simplified -->
  <path d="M100 30 L85 55 Q100 45 115 55 Z" fill="url(#goldGrad)"/>
  <!-- Four lions (simplified as circles) -->
  <circle cx="100" cy="40" r="12" fill="url(#goldGrad)"/>
  <circle cx="100" cy="40" r="8" fill="#033247"/>
  <!-- Ashoka Chakra -->
  <circle cx="100" cy="130" r="15" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="100" cy="130" r="3" fill="url(#goldGrad)"/>
  <!-- Spokes -->
  <g stroke="url(#goldGrad)" stroke-width="1.5">
    <line x1="100" y1="115" x2="100" y2="145"/>
    <line x1="85" y1="130" x2="115" y2="130"/>
    <line x1="89" y1="119" x2="111" y2="141"/>
    <line x1="111" y1="119" x2="89" y2="141"/>
  </g>
  <!-- Star at top -->
  <polygon points="100,15 103,25 113,25 105,31 108,41 100,35 92,41 95,31 87,25 97,25" fill="url(#goldGrad)"/>
  <!-- Text: MCA -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#goldGrad)">MCA</text>
</svg>
